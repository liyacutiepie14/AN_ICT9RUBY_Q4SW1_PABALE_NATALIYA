<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inconsolata:wght@200..900&family=Sekuya&display=swap" rel="stylesheet">
    <title>LOGIN FORM</title>
    <style>
        .sekuya-regular {
     font-family: "Sekuya", system-ui;
     font-weight: 400;
     font-style: normal;
        }

        h1{
            font-family:"Sekuya", system-ui;
            font-weight: 400;
            align-items: center;
            justify-content: center;
            color:#463518;
        }
        body {
            background-image: url('backgroundplaid.webp');
            background-size: cover;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        div {
            background-color: #f3e7d3;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 4px 5px 8px #0000005a;
            border-color: #786e63;
            border-width: 2px;
            border-style: solid;
            align-items: center;
            justify-content: center;
            display: flex;
            flex-direction: column;
        }
    </style>
</head>
<body>
    <div>
       <h1>Login Form</h1>
       <p>Enter your username.</p>
         <input type="text" id="username" placeholder="Enter username"><br><br>
       <p>Enter your password.</p>
         <input type="password" id="password" placeholder="Enter password"><br><br>
            <button onclick="compute()">Login</button>
            <p id="status"></p>
    </div>
       <script>
        var C_USERNAME = "liyacutiepie";
        var C_PASSWORD = "ICTsoc00l";
        var attempt = 0;
        var max_attempt = 3;

        function compute() {
            var username = document.getElementById("username").value;
            var password = document.getElementById("password").value;
            var status = document.getElementById("status");

            if (username === C_USERNAME && password === C_PASSWORD) {
                alert("Login successful!");
                document.getElementById("username").value = "";
                document.getElementById("password").value = "";
                attempt = 0;
                status.textContent = "Login successful!";
            } else {
                attempt++;
                if (attempt < max_attempt) {
                    alert("Incorrect username or password. Attempt " + attempt + " of " + max_attempt);
                    status.textContent = "Incorrect username or password. Attempt " + attempt + " of " + max_attempt;
                } else {
                    alert("Maximum login attempts reached. Access denied.");
                    status.textContent = "Maximum login attempts reached. Access denied.";
                }
            }
        }
       </script>
</body>
       </script>
</body>
</html>
